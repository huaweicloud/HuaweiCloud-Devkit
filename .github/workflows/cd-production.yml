name: CD Production

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  npm-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  remote-deploy:
    needs: npm-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for cloud-server
        id: check
        run: echo "exists=$(test -d cloud-server && echo true || echo false)" >> $GITHUB_OUTPUT
      - name: Deploy production environment
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "TODO: cloud-server production deploy (build image -> push SWR -> canary 10% -> monitor -> full rollout)."

  sync-to-org:
    needs: npm-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Sync main and tags to huaweicloud org
        env:
          HUAWEICLOUD_ORG_TOKEN: ${{ secrets.HUAWEICLOUD_ORG_TOKEN }}
        run: |
          set -e
          git fetch origin main:refs/remotes/origin/main
          url="https://x-access-token:${HUAWEICLOUD_ORG_TOKEN}@github.com/huaweicloud/HuaweiCloud-Devkit.git"
          name="${url%%@*}"
          attempt=0
          while [ "$attempt" -lt 3 ]; do
            attempt=$((attempt+1))
            echo "Sync attempt ${attempt}/3 -> ${name}"
            if git push "${url}" refs/remotes/origin/main:main && git push "${url}" --tags; then
              echo "OK: synced to ${name}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Sync failed to ${name} after 3 attempts"
          exit 1
