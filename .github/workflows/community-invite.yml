name: Community Invite

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  invite:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post community invitation
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const discussionLink = 'https://github.com/huaweicloud/huaweicloud-devkit/discussions/218';
            const issueLink = 'https://github.com/huaweicloud/huaweicloud-devkit/issues/220';
            const isIssue = context.payload.issue !== undefined;
            const number = isIssue ? context.payload.issue.number : context.payload.pull_request.number;
            const type = isIssue ? 'issue' : 'pull request';

            const body = `👋 欢迎提交 ${type} #${number}！

            ---

            🌟 **华为云 DevKit 社区活动进行中！**

            分享你使用 DevKit 的场景/案例，即可赢取 **华为云代金券**：
            - 🥇 最佳实践奖 — ¥200（每月 3 位）
            - 🥈 积极参与奖 — ¥100
            - 🌟 人气之星 — ¥300（月度 👍 最多）

            👉 [**立即分享你的故事 →**](${discussionLink})
            ⭐ [**给 DevKit 点 Star →**](https://github.com/huaweicloud/huaweicloud-devkit)

            ---

            *本消息由 Community Bot 自动发送*`;

            await github.rest.issues.createComment({
              ...repo,
              issue_number: number,
              body: body
            });