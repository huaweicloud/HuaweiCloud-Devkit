name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run linter
        run: |
          echo "Running lint checks..."
          # Python: pip install ruff && ruff check .
          # JS: npx eslint .
          # Go: golangci-lint run .
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: |
          echo "Running tests..."
          # Python: pip install pytest && pytest
          # JS: npm test
          # Go: go test ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          echo "Build successful"
